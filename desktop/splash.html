<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>正在启动</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0b0f14;
    color: #e6edf3;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { text-align: center; }
  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 18px;
    border: 4px solid #2d333b;
    border-top-color: #4b9eff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 4px 0; }
  .sub { color: #8b949e; font-size: 13px; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>正在启动 DeepSeek Harness…</p>
    <p class="sub">首次启动需要编译，请稍候</p>
  </div>
</body>
</html>
